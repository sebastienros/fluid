name: Backport PR to branch

on:
  issue_comment:
    types: [created]
  schedule:
    # Once a day at 14:00 UTC to clean up old runs.
    - cron: '0 14 * * *'

permissions: {}

jobs:
  backport:
    if: >-
      github.repository == 'sebastienros/fluid' &&
      (github.event_name == 'schedule' ||
       (github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/backport to ')))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: dotnet/arcade/.github/workflows/backport-base.yml@1c4a1644edd3811541f70371cd9494058ba29235
    with:
      repository_owners: 'sebastienros'
      pr_description_template: |
        Backport of #%source_pr_number% to %target_branch%

        /cc %cc_users%
