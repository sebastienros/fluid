name: Publish

on:
  push:
    tags:
      - v*

jobs:
  build:

    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
        global-json-file: global.json

    - name: Install dependencies
      run: dotnet restore
    - name: Test
      run: dotnet test -c Release --framework net9.0
    - name: Pack with dotnet
      run: |
        arrTag=(${GITHUB_REF//\// })
        VERSION="${arrTag[2]}"
        VERSION="${VERSION//v}"
        PACKAGE_PATH="${GITHUB_WORKSPACE}/artifacts"
        echo "$VERSION"
        dotnet pack --property:PackageOutputPath=$PACKAGE_PATH --configuration Release -p:Version=$VERSION -p:ContinuousIntegrationBuild=True

    # Kept next to the push as the API key it returns is short-lived
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: sebastienros

    - name: Push with dotnet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
