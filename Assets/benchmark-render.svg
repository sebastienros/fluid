<svg xmlns="http://www.w3.org/2000/svg" width="1051" height="400" viewBox="0 0 1051 400" role="img" aria-labelledby="title desc">
  <title id="title">Render benchmark comparison</title>
  <desc id="desc">Duration and memory allocation for Fluid, Handlebars, Scriban, and DotLiquid rendering. Smaller values are better. Fluid has the smallest values.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #3f3f46; }
      .tick { font-size: 11px; fill: #666; }
      .axis-title { font-size: 13px; font-weight: 600; }
      .grid { stroke: #dedede; stroke-width: 1; }
      .axis { stroke: #8c8c8c; stroke-width: 1; }
      .value { font-size: 11px; text-anchor: middle; fill: #666; }
      .fluid-value { font-size: 11px; font-weight: 700; text-anchor: middle; fill: #125a87; }
      .competitor { opacity: .52; }
    </style>
  </defs>
  <rect width="1051" height="400" fill="#fff"/>

  <g font-size="12">
    <circle cx="155" cy="23" r="5" fill="#1f77b4" stroke="#0b4f79" stroke-width="2"/>
    <text x="166" y="27" font-weight="700">Fluid_Render</text>
    <circle cx="346" cy="23" r="5" fill="#d62728" opacity=".52"/>
    <text x="357" y="27">Handlebars_Render</text>
    <circle cx="569" cy="23" r="5" fill="#ff7f0e" opacity=".52"/>
    <text x="580" y="27">Scriban_Render</text>
    <circle cx="765" cy="23" r="5" fill="#2ca02c" opacity=".52"/>
    <text x="776" y="27">DotLiquid_Render</text>
  </g>
  <text x="525.5" y="59" text-anchor="middle" font-size="12" font-weight="600" fill="#666">Smaller is better ↓</text>

  <g>
    <line class="grid" x1="62" y1="342" x2="500" y2="342"/><text class="tick" x="52" y="346" text-anchor="end">0</text>
    <line class="grid" x1="62" y1="290.4" x2="500" y2="290.4"/><text class="tick" x="52" y="294.4" text-anchor="end">40</text>
    <line class="grid" x1="62" y1="238.8" x2="500" y2="238.8"/><text class="tick" x="52" y="242.8" text-anchor="end">80</text>
    <line class="grid" x1="62" y1="187.2" x2="500" y2="187.2"/><text class="tick" x="52" y="191.2" text-anchor="end">120</text>
    <line class="grid" x1="62" y1="135.6" x2="500" y2="135.6"/><text class="tick" x="52" y="139.6" text-anchor="end">160</text>
    <line class="grid" x1="62" y1="84" x2="500" y2="84"/><text class="tick" x="52" y="88" text-anchor="end">200</text>
    <line class="axis" x1="62" y1="84" x2="62" y2="342"/><line class="axis" x1="62" y1="342" x2="500" y2="342"/>

    <rect x="88" y="320.8" width="72" height="21.2" rx="1" fill="#1f77b4" stroke="#0b4f79" stroke-width="2.5"/>
    <text class="fluid-value" x="124" y="314">16.426</text>
    <rect class="competitor" x="193" y="313.7" width="72" height="28.3" rx="1" fill="#d62728"/>
    <text class="value" x="229" y="307">21.926</text>
    <rect class="competitor" x="298" y="177.2" width="72" height="164.8" rx="1" fill="#ff7f0e"/>
    <text class="value" x="334" y="170">127.750</text>
    <rect class="competitor" x="403" y="126.8" width="72" height="215.2" rx="1" fill="#2ca02c"/>
    <text class="value" x="439" y="120">166.841</text>
    <text class="axis-title" x="281" y="381" text-anchor="middle">Duration (Microseconds)</text>
  </g>

  <g>
    <line class="grid" x1="588" y1="342" x2="1026" y2="342"/><text class="tick" x="578" y="346" text-anchor="end">0</text>
    <line class="grid" x1="588" y1="290.4" x2="1026" y2="290.4"/><text class="tick" x="578" y="294.4" text-anchor="end">140</text>
    <line class="grid" x1="588" y1="238.8" x2="1026" y2="238.8"/><text class="tick" x="578" y="242.8" text-anchor="end">280</text>
    <line class="grid" x1="588" y1="187.2" x2="1026" y2="187.2"/><text class="tick" x="578" y="191.2" text-anchor="end">420</text>
    <line class="grid" x1="588" y1="135.6" x2="1026" y2="135.6"/><text class="tick" x="578" y="139.6" text-anchor="end">560</text>
    <line class="grid" x1="588" y1="84" x2="1026" y2="84"/><text class="tick" x="578" y="88" text-anchor="end">700</text>
    <line class="axis" x1="588" y1="84" x2="588" y2="342"/><line class="axis" x1="588" y1="342" x2="1026" y2="342"/>

    <rect x="614" y="328.6" width="72" height="13.4" rx="1" fill="#1f77b4" stroke="#0b4f79" stroke-width="2.5"/>
    <text class="fluid-value" x="650" y="321">36.26</text>
    <rect class="competitor" x="719" y="298" width="72" height="44" rx="1" fill="#d62728"/>
    <text class="value" x="755" y="291">119.31</text>
    <rect class="competitor" x="824" y="210" width="72" height="132" rx="1" fill="#ff7f0e"/>
    <text class="value" x="860" y="203">358.12</text>
    <rect class="competitor" x="929" y="99" width="72" height="243" rx="1" fill="#2ca02c"/>
    <text class="value" x="965" y="92">659.18</text>
    <text class="axis-title" x="807" y="381" text-anchor="middle">Memory Allocation (Kilobytes)</text>
  </g>
</svg>
